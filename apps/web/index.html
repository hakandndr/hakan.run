<!doctype html>
<html lang="en" style="background-color:#090909">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Ctext x='50' y='60' font-family='monospace' font-size='40' font-weight='bold' fill='%2300d2ff' text-anchor='middle'%3E%26lt%3Bh/%26gt%3B%3C/text%3E%3Ctext x='50' y='85' font-family='sans-serif' font-size='14' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3Ehakan.run%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hakan.run</title>
  <link rel="canonical" href="https://hakan.run/" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#090909" />
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    // BootIntro is first-entry presentation for the public site. It is decided
    // here, before the body paints, and claimed once per tab session.
    (function () {
      var show = false;
      if (!/^\/(notes|boss)(\/|$)/.test(location.pathname)) {
        try {
          show = sessionStorage.getItem('hakan.run:boot-intro-seen') !== '1';
          if (show) sessionStorage.setItem('hakan.run:boot-intro-seen', '1');
        } catch (error) {
          show = true;
        }
      }
      if (!show) document.documentElement.setAttribute('data-boot-intro', 'off');
    })();
  </script>
  <style>
    html,body,#root{min-height:100%;margin:0;background:#090909}
    html[data-boot-intro="off"] [data-boot-intro="presentation"]{display:none}
  </style>
</head>

<body style="background-color:#090909">
  <div id="root"></div>
  <script>
    // A server-rendered document already has its final height here, so a
    // reload or history load can take its saved position before the first
    // paint. ScrollManager applies the same checkpoint after hydration.
    (function () {
      try {
        var saved = history.state && history.state.__hakanRunScroll;
        if (saved && document.getElementById('root').firstElementChild) window.scrollTo(saved.x, saved.y);
      } catch (error) {}
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
